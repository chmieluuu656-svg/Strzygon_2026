<!DOCTYPE html> <html lang="pl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Wpisz kod</title> <style>
  body { background: #111; color: white; font-family: Arial, sans-serif; text-align: center; padding-top: 100px; } input { padding: 12px; font-size: 20px; width: 200px; text-align: center; }
  button { padding: 12px 25px; font-size: 18px; margin-top: 15px; cursor: pointer; } #obrazek { display: none; margin: 30px auto; max-width: 90%; max-height: 80vh; } #blad { color: red; margin-top: 15px; } 
</style> </head> <body> <h1>Wpisz klucz</h1> <input type="password" id="kod" placeholder="Kod"> <br> <button onclick="sprawdzKod()">Zatwierdź</button> <div id="blad"></div> <img id="obrazek" src="obrazek.jpg" alt="Obrazek">
  <script> function sprawdzKod() { const kod = document.getElementById("kod").value; const obrazek = document.getElementById("obrazek"); const blad = document.getElementById("blad"); 
                                  if (kod === "2353") { obrazek.style.display = "block"; blad.textContent = ""; } else { obrazek.style.display = "none"; blad.textContent = "Nieprawidłowy klucz!"; } } 
  </script> </body> </html>
